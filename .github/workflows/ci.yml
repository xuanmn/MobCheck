name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly check on Thursdays at 14:00 UTC (after standard OSRS/RuneLite weekly updates)
    - cron: '0 14 * * 4'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK 11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew check test
