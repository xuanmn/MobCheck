name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly check on Thursdays at 14:00 UTC (after standard OSRS/RuneLite weekly updates)
    - cron: '0 14 * * 4'
  workflow_dispatch:

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build & Test (JDK ${{ matrix.java }})
    needs: validate-wrapper
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk${{ matrix.java }}
          path: build/reports/tests/test/
          retention-days: 14

      - name: Upload plugin JAR
        if: matrix.java == '11'
        uses: actions/upload-artifact@v4
        with:
          name: mob-check-plugin
          path: build/libs/*.jar
          retention-days: 30

  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    needs: validate-wrapper
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Submit dependencies
        uses: mikepenz/gradle-dependency-submission@v1
        with:
          gradle-build-module: ':'
