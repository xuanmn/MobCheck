name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly check on Thursdays at 14:00 UTC (after standard OSRS/RuneLite weekly updates)
    - cron: "0 14 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        # Note: setup-gradle automatically validates wrapper checksums and manages caching

      - name: Build and Test
        run: ./gradlew build shadowJar

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk${{ matrix.java }}
          path: build/reports/tests/test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload plugin JARs
        if: matrix.java == '11'
        uses: actions/upload-artifact@v4
        with:
          name: mob-check-plugin-artifacts
          path: build/libs/*.jar
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release binaries
        run: ./gradlew build shadowJar

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
